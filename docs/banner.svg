<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Omnipotent banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.05">
    <g id="row">
      <circle cx="40" cy="40" r="1.5"/><circle cx="100" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/><circle cx="220" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="340" cy="40" r="1.5"/><circle cx="400" cy="40" r="1.5"/><circle cx="460" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="580" cy="40" r="1.5"/><circle cx="640" cy="40" r="1.5"/><circle cx="700" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="820" cy="40" r="1.5"/><circle cx="880" cy="40" r="1.5"/><circle cx="940" cy="40" r="1.5"/><circle cx="1000" cy="40" r="1.5"/><circle cx="1060" cy="40" r="1.5"/><circle cx="1120" cy="40" r="1.5"/><circle cx="1180" cy="40" r="1.5"/><circle cx="1240" cy="40" r="1.5"/>
    </g>
    <use href="#row" y="60"/><use href="#row" y="120"/><use href="#row" y="180"/><use href="#row" y="240"/>
  </g>

  <!-- delegation mesh: central rep node linked to five shadow-role nodes -->
  <g stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="1050" y1="160" x2="890" y2="70"/>
    <line x1="1050" y1="160" x2="930" y2="250"/>
    <line x1="1050" y1="160" x2="1180" y2="90"/>
    <line x1="1050" y1="160" x2="1200" y2="245"/>
    <line x1="1050" y1="160" x2="1050" y2="45"/>
  </g>
  <g stroke="#818cf8" stroke-opacity="0.35" stroke-width="1">
    <line x1="890" y1="70" x2="1050" y2="45"/>
    <line x1="1050" y1="45" x2="1180" y2="90"/>
    <line x1="930" y1="250" x2="1200" y2="245"/>
  </g>

  <!-- role nodes -->
  <g>
    <circle cx="890" cy="70" r="13" fill="#0b0d14" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="890" cy="70" r="4" fill="#60a5fa"/>
    <circle cx="930" cy="250" r="13" fill="#0b0d14" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="930" cy="250" r="4" fill="#a78bfa"/>
    <circle cx="1180" cy="90" r="13" fill="#0b0d14" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="1180" cy="90" r="4" fill="#34d399"/>
    <circle cx="1200" cy="245" r="13" fill="#0b0d14" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="1200" cy="245" r="4" fill="#fbbf24"/>
    <circle cx="1050" cy="45" r="13" fill="#0b0d14" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="1050" cy="45" r="4" fill="#22d3ee"/>
  </g>

  <!-- central frontline rep node -->
  <circle cx="1050" cy="160" r="34" fill="url(#core)" opacity="0.25"/>
  <circle cx="1050" cy="160" r="22" fill="url(#core)"/>
  <circle cx="1050" cy="160" r="22" fill="none" stroke="#bfdbfe" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="1050" cy="160" r="6" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="70" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="10" fill="url(#word)">OMNIPOTENT</text>
  <text x="74" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="21" letter-spacing="3" fill="#94a3b8">AUTONOMOUS ENTERPRISE OPERATIONS ENGINE</text>

  <g transform="translate(74,222)">
    <rect width="176" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.4"/>
    <circle cx="16" cy="13" r="3.5" fill="#34d399"/>
    <text x="30" y="17" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" letter-spacing="1.5" fill="#93c5fd">KILL THE BUSYWORK</text>
  </g>
</svg>
